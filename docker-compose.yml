services:
  yolo-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_NAME=yolo-epi.pt
    networks:
      - yolo-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  yolo-stream:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-stream
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models:ro
    command: >
      python3 stream/mjpeg_server.py
      --device 0
      --model models/yolo-epi.pt
      --infer-every 3
      --infer-size 320
      --port 5000
    networks:
      - yolo-net
    depends_on:
      yolo-api:
        condition: service_healthy

  yolo-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: yolo-client
    volumes:
      - ./images:/client/images:ro
      - ./output:/client/output
    environment:
      - API_URL=http://yolo-api:8000
    networks:
      - yolo-net
    depends_on:
      yolo-api:
        condition: service_healthy

networks:
  yolo-net:
    driver: bridge
